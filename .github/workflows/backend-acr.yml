name: Build And Push Backend To ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.AZURE_ACR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate registry secrets
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "AZURE_ACR_LOGIN_SERVER is missing."
            exit 1
          fi
          if [ -z "${REGISTRY_USERNAME}" ]; then
            echo "AZURE_ACR_USERNAME is missing."
            exit 1
          fi
          if [ -z "${REGISTRY_PASSWORD}" ]; then
            echo "AZURE_ACR_PASSWORD is missing."
            exit 1
          fi

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/auto-subjective-grader-backend:latest
            ${{ env.REGISTRY }}/auto-subjective-grader-backend:${{ github.sha }}
